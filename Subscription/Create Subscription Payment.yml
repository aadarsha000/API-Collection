info:
  name: Create Subscription Payment
  type: http
  seq: 1

http:
  method: POST
  url: "{{API_URL}}/api/subscriptions/payment/"
  headers:
    - name: Authorization
      value: Bearer {{ACCESS_TOKEN}}
  body:
    type: json
    data: |-
      {
        "years":1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: success
    request:
      url: "{{API_URL}}/api/subscriptions/payment/"
      method: POST
      headers:
        - name: Authorization
          value: Bearer {{ACCESS_TOKEN}}
      body:
        type: json
        data: |-
          {
            "years":1
          }
